[project]
name = "content-suite-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "langfuse>=4.15.2",
    "openai>=3.13.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependency injection uses Depends() in parameter defaults by design.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# env.py and conftest.py need imports after side-effectful setup (fileConfig, env vars).
"alembic/env.py" = ["E402"]
"tests/conftest.py" = ["E402"]
